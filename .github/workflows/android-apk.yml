name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/madskillz-ai-readiness-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: madskillz-android-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Create Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          name: MaDSkillz ${{ github.ref_name }}
          body: |
            ## MaDSkillz AI Readiness — Android APK
            
            Download `madskillz-ai-readiness-debug.apk` below and install on any Android device.
            
            **To install:**
            1. Download the APK to your phone
            2. Open it — Android will ask for permission to install from unknown sources
            3. Tap Install
            
            Built by Innocent Forteh — Team21 Academy
          generate_release_notes: true
